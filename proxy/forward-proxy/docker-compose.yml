version: "3.8"

networks:
  proxy-net:
    driver: bridge

services:
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-forward-proxy
    ports:
      - "8888:8888"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy-net
    restart: unless-stopped

  server-a:
    image: node:18-alpine
    container_name: server-a
    hostname: server-a
    working_dir: /app
    volumes:
      - ./:/app
    command: node server-a.js
    ports:
      - "3001:3000"
    networks:
      - proxy-net
    restart: unless-stopped

  server-b:
    image: node:18-alpine
    container_name: server-b
    hostname: server-b
    working_dir: /app
    volumes:
      - ./:/app
    command: node server-b.js
    ports:
      - "3002:3000"
    networks:
      - proxy-net
    restart: unless-stopped
