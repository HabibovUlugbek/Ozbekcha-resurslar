# ─────────────────────────────────────────────────────────────────
# Nginx Forward Proxy
#
# Limitation: HTTPS bilan ishlash uchun CONNECT methodini qo'llab-quvvatlamaydi, faqat HTTP trafikni yo'naltiradi.
# ─────────────────────────────────────────────────────────────────

# ACL jadvali: 1 = ruxsat berilgan, 0 = bloklangan
# $http_host - bu klient yuborgan Host sarlavhasi (masalan, "server-a:3000")
# Portni olib tashlash uchun ~* ishlatiladi, faqat hostname qismi mos keladi
map $http_host $allowed_host {
    default              0;          # hammasini bloklash, faqat ro'yxatda bo'lganlarni ruxsat berish
    "~*^server-a"        1;          # server-a ga ruxsat berish (har qanday port)
}

server {
    listen 8888;                     # forward proxy port - foydalanuvchilar shu port orqali proxyga ulanadi

    # ── Ruxsat berilmagan manzillarni bloklash ──────────────────────────────
    if ($allowed_host = 0) {
        return 403 "Forbidden: $http_host is not in the allowed list\n";
    }

    # ── Forward proxy core ─────────────────────────────────────────
    location / {
        # Dockerga o'zining ichki DNS serveriga ega, bu konteynerlar orasidagi hostname'larni hal qilish imkonini beradi
        resolver 127.0.0.11 valid=30s;

        # $scheme - bu protokol (http yoki https), $http_host - bu klient yuborgan Host sarlavhasi, $request_uri - bu so'rovning URI qismi
        proxy_pass $scheme://$http_host$request_uri;

        proxy_set_header Host $http_host;

        # Proxy-specific sarlavhalarni olib tashlash, shunda serverlar proxy ishlatilayotganini bilmaydi
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }
}